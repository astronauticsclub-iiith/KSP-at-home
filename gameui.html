<!DOCTYPE html>
<html lang="en">

<head>
  <title>KSP at Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }

  canvas {
    display: block;
  }

  #ui {
    position: absolute;
    top: 2vh;
    left: 2vw;
    z-index: 10;

    display: flex;
    gap: 10px;
  }

  button {
    padding: 8px 12px;
    font-size: 14px;
  }
</style>

<body class="m-0 overflow-hidden bg-black text-green-400 font-mono">
  <div id="rotate-overlay">
    <div class="icon">Rotate</div>
    <div>Rotate your device to landscape to continue</div>
  </div>

  <div class="fixed inset-0 z-10 pointer-events-none">

    <!-- control column -->
    <div id="controls" class="absolute top-4 left-4
             flex flex-col gap-2
             pointer-events-auto">

      <button id="prograde" class="w-40
               border border-green-500
               bg-black/80
               px-4 py-2
               text-left
               hover:bg-green-500/10
               active:bg-green-500/20
               transition">
        PROGRADE (P)
      </button>

      <button id="retrograde" class="w-40
               border border-green-500
               bg-black/80
               px-4 py-2
               text-left
               hover:bg-green-500/10
               active:bg-green-500/20
               transition">
        RETROGRADE (R)
      </button>

      <button id="predict" class="w-40
               border border-green-500
               bg-black/80
               px-4 py-2
               text-left
               hover:bg-green-500/10
               active:bg-green-500/20
               transition">
        Predict Trajectory
      </button>

      <div id="timer" class="w-40
               border border-green-500
               bg-black/80
               px-4 py-2
               text-left
               hover:bg-green-500/10
               active:bg-green-500/20
               transition">
        Timer:0
      </div>

      <a id="back-btn" href="index.html" class="back-btn w-20
               border border-green-500/70
               bg-black/80
               px-2 py-1
               text-xs
               text-center
               hover:bg-green-500/10
               active:bg-green-500/20
               transition
               no-underline text-green-400">
        BACK
      </a>

    </div>

    <!-- TELEMETRY -->
    <div id="telemetry" class="absolute bottom-4 left-4
             w-72
             border border-green-500
             bg-black/85
             p-4
             text-sm
             leading-6">

      <div class="mb-3 border-b border-green-500 pb-2">
        FLIGHT TELEMETRY
      </div>

      <div class="flex justify-between">
        <span>VELOCITY</span>
        <span id="velocity">0</span>
      </div>
      <div class="flex justify-between">
        <span>ACCELERATION</span>
        <span id="acceleration">0</span>
      </div>

      <div class="flex justify-between">
        <span>TIMESTEP</span>
        <span id="timestep">-</span>
      </div>

      <div class="flex justify-between">
        <span>SCORE</span>
        <span id="score">-</span>
      </div>

      <div class="flex justify-between">
        <span>ORBIT</span>
        <span id="orbit-timer">-</span>
      </div>

    </div>
  </div>
  <!-- ------------------------------------------ -->

  <div id="tutorial-popup" class="fixed inset-0 z-50
             flex items-center justify-center
             bg-black/70">

    <div class="border border-green-500
               bg-black/95
               max-w-md
               p-6
               text-green-400
               font-mono
               leading-relaxed">

      <div class="mb-3 border-b border-green-500 pb-2 text-lg">
        MISSION BRIEFING
      </div>

      <!-- Populated dynamically by ui.js setBriefing() from level.json -->
      <div id="briefing-body"></div>

      <!-- Destination callout, populated by setBriefing() -->
      <div class="mb-6 text-green-300 text-sm">
        DESTINATION: <span id="briefing-destination"></span>
      </div>

      <button id="tutorial-close" class="w-full
                   border border-green-500
                   px-4 py-2
                   hover:bg-green-500/10
                   active:bg-green-500/20
                   transition">
        BEGIN MISSION
      </button>

    </div>
  </div>

  <script type="module">
    import { reset_timer } from './src/frontend/ui.js'

    document.getElementById('tutorial-close').addEventListener('click', () => {
      document.getElementById('tutorial-popup').hidden = true;
      reset_timer();
      window.dispatchEvent(new Event('missionStart'));
    });
  </script>

  <!-- Win overlay -->
  <div id="win-overlay" class="win-overlay" hidden>
    <div class="win-panel">
      <div class="win-title">MISSION COMPLETE</div>
      <div id="win-stats" class="win-stats"></div>
      <a href="index.html"
         class="w-full
                border border-green-500
                bg-black/80
                px-6 py-3
                text-green-400
                font-mono
                text-center
                hover:bg-green-500/10
                transition">
        RETURN TO HOME
      </a>
    </div>
  </div>

  <!-- Crash overlay -->

  <div id="crash-overlay" class="crash-overlay" hidden>
    <div class="crash-panel">
      <div id="crash-message" class="crash-message">MISSION FAILED</div>
      <div id="crash-target" class="crash-target"></div>
      <button id="restart-btn" class="launch-button
      border border-green-500
      bg-black/80
      px-6 py-3
      text-green-400
      font-mono
      hover:bg-green-500/10
      active:bg-green-500/20
      transition">
        RESTART MISSION
      </button>
      <span class=" crash-hint">Press <kbd>R</kbd> to restart</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSP at Home</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    position: relative;
    overflow: hidden;
    background-color: #020001;
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  /* soft glow behind the content */
  body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(90, 60, 160, 0.25) 0%, rgba(90, 60, 160, 0) 70%);
    z-index: 0;
  }

  /* starfield layer */
  /* BEWARE: AI Generated stars and background */
  .stars {
    position: absolute;
    inset: 0; 
    z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #ffffff 100%, transparent 0),
      radial-gradient(1px 1px at 25% 65%, #ffffff 100%, transparent 0),
      radial-gradient(2px 2px at 40% 15%, #ffffff 100%, transparent 0),
      radial-gradient(1px 1px at 55% 80%, #ffffff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 70% 30%, #ffffff 100%, transparent 0),
      radial-gradient(1px 1px at 80% 60%, #ffffff 100%, transparent 0),
      radial-gradient(2px 2px at 90% 10%, #ffffff 100%, transparent 0),
      radial-gradient(1px 1px at 15% 90%, #ffffff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 35% 45%, #ffffff 100%, transparent 0),
      radial-gradient(1px 1px at 65% 55%, #ffffff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 85% 85%, #ffffff 100%, transparent 0),
      radial-gradient(1px 1px at 95% 40%, #ffffff 100%, transparent 0);
    background-repeat: repeat;
    background-size: 100% 100%;
    opacity: 0.6;
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.35; }
    to   { opacity: 0.85; }
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 140px;
    height: auto;
    margin-bottom: 1.5rem;
    border-radius: 50%;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .tagline {
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 1.5rem;
    max-width: 500px;
  }

  .underline {
    width: 96px;
    height: 4px;
    background-color: #ffffff;
    margin: 0 auto 4rem auto;
  }

  .levels {
    display: flex;
    gap: 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .level-btn {
    display: block;
    width: 220px;
    padding: 2.5rem 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    color: #ffffff;
    text-decoration: none;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    background-color: rgba(255, 255, 255, 0.03);
    transition: all 0.3s ease;
  }

  .level-btn:hover,
  .level-btn:focus {
    background-color: rgba(255, 255, 255, 0.1);
    border-color: #ffffff;
    transform: translateY(-6px);
  }

  .level-btn .sub {
    display: block;
    font-size: 0.9rem;
    font-weight: 400;
    opacity: 0.5;
    margin-top: 0.5rem;
    text-transform: none;
    letter-spacing: normal;
  }

  @media (max-width: 500px) {
    h1 { font-size: 2.25rem; }
    .level-btn { width: 160px; padding: 2rem 1rem; }
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <img src="assets/astro.png" alt="Logo" class="logo">

    <h1>KSP at Home</h1>
    <div class="underline"></div>

    <div class="levels">
      <a href="src/gameui.html" class="level-btn">
        Level 1
        <span class="sub">Start here</span>
      </a>
      <a href="level2.html" class="level-btn">
        Level 2
        <span class="sub">Continue</span>
      </a>
    </div>
  </div>

</body>
</html>
